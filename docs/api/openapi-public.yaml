  openapi: 3.1.0
  info:
    title: JobsTheWorld Public API
    version: 1.0.0
    description: Public frontend API for querying jobs and guided matching. Response
      examples use sanitized stored job data where available; examples are snapshots,
      not a promise of current availability.
  servers:
  - url: https://api.jobsthe.world
  paths:
    /api/health:
      get:
        summary: Health
        operationId: health
        responses:
          '200':
            description: Success
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    success:
                      const: true
                    data:
                      type: object
                      properties:
                        status:
                          const: ok
                  required:
                  - success
                  - data
          '400':
            description: Invalid request parameters or body.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
                example:
                  success: false
                  error: Invalid request
          '500':
            description: Unexpected server error.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
                example:
                  success: false
                  error: Internal server error
    /api/jobs:
      get:
        summary: Search jobs
        operationId: search_jobs
        responses:
          '200':
            description: Success
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/JobList'
                  required:
                  - success
                  - data
                examples:
                  usSalesRecent:
                    summary: Recent US sales/customer-care result — PNC
                    description: Observed on 2026-09-24 for /api/jobs?country=US&category=sales&page=1&limit=1.
                      Category searches also match title/description keywords, so this
                      sales/customer-care role has stored category remote-work. The
                      pagination is the actual response, not a count of exact-category
                      rows. Employer logo omitted.
                    value:
                      success: true
                      data:
                        jobs:
                        - id: 1675
                          slug: sales-service-representative-customer-care-center-389d988d
                          title: Sales & Service Representative-Customer Care Center
                          company:
                            id: 1676
                            name: PNC
                            logoUrl: null
                          category: remote-work
                          location: Anywhere
                          city: null
                          state: null
                          country: US
                          employmentType: Full-time
                          isRemote: true
                          salaryMin: null
                          salaryMax: null
                          salaryPeriod: null
                          postedAt: '2026-09-23T08:30:00.000Z'
                          firstSeenAt: '2026-09-24T01:03:50.000Z'
                          lastSeenAt: '2026-09-24T01:03:50.000Z'
                        pagination:
                          page: 1
                          limit: 1
                          total: 124
                          totalPages: 124
                  usWarehouseSingleJob:
                    summary: Stored US warehouse result
                    description: 'Sanitized snapshot of stored JobsTheWorld data, captured
                      2026-09-24. Results and availability may change. Employer logos
                      and application destinations are omitted; any description shown
                      is an excerpt. Request: /api/jobs?country=US&category=warehouse-logistics&page=1&limit=1.
                      The 217 total includes the existing category/keyword matching
                      behavior.'
                    value:
                      success: true
                      data:
                        jobs:
                        - id: 465
                          slug: shipping-receiving-clerk-70d9e218
                          title: Shipping/Receiving Clerk
                          company:
                            id: 466
                            name: Metals USA
                            logoUrl: null
                          category: warehouse-logistics
                          location: Torrington, CT
                          city: Torrington
                          state: Connecticut
                          country: US
                          employmentType: Full-time
                          isRemote: false
                          salaryMin: 22
                          salaryMax: 24
                          salaryPeriod: HOUR
                          postedAt: null
                          firstSeenAt: '2026-07-25T13:29:09.000Z'
                          lastSeenAt: '2026-07-25T13:29:09.000Z'
                        pagination:
                          page: 1
                          limit: 1
                          total: 217
                          totalPages: 217
                  gbRemoteCustomerService:
                    summary: No matching GB remote jobs
                    description: Observed response to /api/jobs?country=GB&q=customer%20service&remote=true&page=1&limit=20
                      on 2026-09-24. An empty result still reports totalPages=1.
                    value:
                      success: true
                      data:
                        jobs: []
                        pagination:
                          page: 1
                          limit: 20
                          total: 0
                          totalPages: 1
            headers:
              Cache-Control:
                schema:
                  type: string
                example: public, max-age=0, s-maxage=1800, must-revalidate
          '400':
            description: Invalid request parameters or body.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
                example:
                  success: false
                  error: Invalid request
          '500':
            description: Unexpected server error.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
                example:
                  success: false
                  error: Internal server error
        parameters:
        - name: country
          in: query
          required: false
          description: ISO country code; US, GB, DE and AU supported, alongside retained
            markets. Unsupported countries currently behave as no country filter.
          schema:
            type: string
          examples:
            us:
              summary: United States
              value: US
            gb:
              summary: United Kingdom
              value: GB
            de:
              summary: Germany
              value: DE
            au:
              summary: Australia
              value: AU
        - name: category
          in: query
          required: false
          description: Canonical category slug or recognized label/alias; unknown values
            currently behave as no category filter. Category matches existing category
            aliases and title/description terms.
          schema:
            type: string
          examples:
            warehouse:
              summary: Warehouse and logistics
              value: warehouse-logistics
            retail:
              summary: Retail and store
              value: retail-store
            sales:
              summary: Sales
              value: sales
        - name: q
          in: query
          required: false
          description: Substring search across title, company, location and description.
          schema:
            type: string
          examples:
            customerService:
              summary: Customer service text search
              value: customer service
        - name: city
          in: query
          required: false
          description: Substring match.
          schema:
            type: string
          examples:
            berlin:
              summary: Berlin
              value: Berlin
            torrington:
              summary: Torrington
              value: Torrington
        - name: state
          in: query
          required: false
          description: Substring match.
          schema:
            type: string
          examples:
            connecticut:
              summary: Connecticut
              value: Connecticut
        - name: remote
          in: query
          required: false
          description: true/1/yes/remote or false/0/no; unrecognized strings currently
            mean no filter.
          schema:
            type: string
          examples:
            remoteOnly:
              summary: Remote only
              value: 'true'
            onSite:
              summary: Non-remote only
              value: 'false'
        - name: employment_type
          in: query
          required: false
          description: Full-time, Part-time, Contract, Internship, Temporary; flexible/any
            means no filter.
          schema:
            type: string
          examples:
            fullTime:
              summary: Full-time
              value: Full-time
            partTime:
              summary: Part-time
              value: Part-time
        - name: experience_level
          in: query
          required: false
          description: Entry/no experience or experienced uses title/description keywords;
            some means no filter.
          schema:
            type: string
          examples:
            entry:
              summary: Entry-level keywords
              value: entry
            experienced:
              summary: Experienced-role keywords
              value: experienced
        - name: page
          in: query
          required: false
          description: Pagination
          schema:
            type: integer
            minimum: 1
            default: 1
          examples:
            firstPage:
              summary: First page
              value: 1
        - name: limit
          in: query
          required: false
          description: Pagination
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          examples:
            standard:
              summary: Standard page size
              value: 20
            compact:
              summary: One-job example
              value: 1
        description: 'Search active stored jobs. Use category values returned by GET
          /api/categories; warehouse-logistics and retail-store are the supported values
          for warehouse and retail searches. The shorter words warehouse and retail
          are not recognized category aliases and must not be used as category filters.


          Example searches:

          - Recent US sales/customer-care example: `/api/jobs?country=US&category=sales&page=1&limit=1`

          - US warehouse jobs: `/api/jobs?country=US&category=warehouse-logistics&page=1&limit=20`

          - GB remote customer service: `/api/jobs?country=GB&q=customer%20service&remote=true&page=1&limit=20`

          - Berlin full-time jobs: `/api/jobs?country=DE&city=Berlin&employment_type=Full-time&page=1&limit=20`

          - AU retail jobs: `/api/jobs?country=AU&category=retail-store&page=1&limit=20`


          These examples use independent combinations of filters; they are not one combined
          query. Response example usWarehouseSingleJob uses limit=1 to keep the sample
          concise and retains the actual pagination totals. gbRemoteCustomerService
          demonstrates an observed empty result. No populated DE/AU results are asserted.


          Shared-cache TTL: free text 300 seconds, city/state 900 seconds, otherwise
          1800 seconds. Cache keys include every query dimension.


          The usSalesRecent response shows a recently posted PNC role with a populated
          postedAt value; other named examples retain their original capture context.'
    /api/jobs/search:
      get:
        summary: Normalized job search
        operationId: search_stored_jobs
        description: 'Search active stored jobs. Results use posted_at DESC, id DESC;
          null posting dates sort last. Empty results have totalPages 0. String filters
          are trimmed; blank values, repeated parameters, unknown parameters and invalid
          values return 400 with Cache-Control: no-store. Reads stored data only. Pagination
          is deterministic for unchanged data, not a snapshot across concurrent writes.


          Examples:

          - /api/jobs/search?country=US&category=warehouse-logistics&page=1&limit=20

          - /api/jobs/search?country=US&q=customer%20service&remote=true&page=1&limit=20

          - /api/jobs/search?country=US&city=New%20York&employment_type=Full-time&page=1&limit=20'
        parameters:
        - name: country
          in: query
          required: false
          description: ISO 3166-1 alpha-2 country, trimmed and uppercased; unknown codes
            return 400.
          schema:
            type: string
            pattern: ^[A-Za-z]{2}$
          example: US
        - name: category
          in: query
          required: false
          description: Canonical category, label or existing alias; trimmed and case-insensitive.
            Unknown values return 400. Matches mapped stored categories, without keyword
            expansion.
          schema:
            type: string
          example: warehouse-logistics
        - name: q
          in: query
          required: false
          description: Trimmed text matched against title, company, location and description
            using SQL LIKE.
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: customer service
        - name: city
          in: query
          required: false
          description: Trimmed city substring (SQL LIKE).
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: New York
        - name: state
          in: query
          required: false
          description: Trimmed state substring (SQL LIKE).
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: New York
        - name: remote
          in: query
          required: false
          description: Trimmed, case-insensitive true/false or 1/0 only.
          schema:
            type: string
            enum:
            - 'true'
            - 'false'
            - '1'
            - '0'
          example: 'true'
        - name: employment_type
          in: query
          required: false
          description: Trimmed, case-insensitive supported employment type.
          schema:
            type: string
            enum:
            - Full-time
            - Part-time
            - Contract
            - Internship
            - Temporary
          example: Full-time
        - name: experience_level
          in: query
          required: false
          description: 'Keyword approximation in title/description: entry-level uses entry/trainee/associate/assistant/training;
            mid-level uses mid-level/intermediate; senior uses senior/lead/manager/specialist.'
          schema:
            type: string
            enum:
            - entry-level
            - mid-level
            - senior
          example: entry-level
        - name: page
          in: query
          required: false
          description: Positive integer; offset must be a safe integer. Decimal and exponent
            forms are rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 9007199254740991
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          description: Results per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        responses:
          '200':
            description: Success
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    success:
                      const: true
                    data:
                      $ref: '#/components/schemas/SearchJobList'
                  required:
                  - success
                  - data
                examples:
                  storedWarehouse:
                    summary: Representative stored warehouse job
                    description: Sanitized real stored job captured 2026-09-24. This one-row
                      illustrative dataset demonstrates the response shape; totals are
                      illustrative, not current production counts.
                    value:
                      success: true
                      data:
                        jobs:
                        - id: 465
                          slug: shipping-receiving-clerk-70d9e218
                          title: Shipping/Receiving Clerk
                          company:
                            id: 466
                            name: Metals USA
                            logoUrl: null
                          category: warehouse-logistics
                          location: Torrington, CT
                          city: Torrington
                          state: Connecticut
                          country: US
                          employmentType: Full-time
                          isRemote: false
                          salaryMin: 22
                          salaryMax: 24
                          salaryPeriod: HOUR
                          postedAt: null
                          firstSeenAt: '2026-07-25T13:29:09.000Z'
                          lastSeenAt: '2026-07-25T13:29:09.000Z'
                        pagination:
                          page: 1
                          limit: 20
                          total: 1
                          totalPages: 1
                  empty:
                    summary: No matching active jobs
                    value:
                      success: true
                      data:
                        jobs: []
                        pagination:
                          page: 1
                          limit: 20
                          total: 0
                          totalPages: 0
            headers:
              Cache-Control:
                description: public, max-age=0, s-maxage=N, must-revalidate. N=300 for
                  q; otherwise 900 for city/state; otherwise 1800 for country/category;
                  otherwise 300. Cache the full URL including every query parameter and
                  Vary dimensions.
                schema:
                  type: string
                example: public, max-age=0, s-maxage=300, must-revalidate
          '400':
            description: Invalid request parameters or body.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
                example:
                  success: false
                  error: Invalid request
          '500':
            description: Unexpected server error.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
                example:
                  success: false
                  error: Internal server error
